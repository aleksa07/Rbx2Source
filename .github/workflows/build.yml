name: Build Rbx2Source
on:
  push:
    branches: [ "main", "experimental" ]
  pull_request:
    branches: [ "main", "experimental" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Clone Dependency Repository
      run: |
         cd ..
          git clone https://github.com/MaximumADHD/Roblox-File-Format.git
          cd Roblox-File-Format
          nuget restore

    - name: Restore dependencies
      run: nuget restore
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
    - name: Build
      run: msbuild Rbx2Source.sln /p:Platform=x64
    - name: VirusTotal Scan
      continue-on-error: true
      uses: crazy-max/ghaction-virustotal@v3
      with:
        vt_api_key: ${{ secrets.VT_APIKEY}}
        request_rate: 4
        files: bin/x64/Debug/Rbx2Source.exe
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rbx2Source
        path: bin/x64/Debug/Rbx2Source.exe
        if-no-files-found: error
